function position_element(el, x, y)
{
 //el.setAttribute('transform', `translate(${x}, ${y})`);
 let bv = el.transform.baseVal;
 if(bv.length == 0)
   el.setAttribute('transform', `translate(${x}, ${y})`);
 else
   el.transform.baseVal.getItem(0).setTranslate(x,y);
}


function position_token(token, x, y)
{
 position_element(token, x, y);
// token.setAttribute('transform', `translate(${x}, ${y})`);
// token.setAttribute('visibility', 'hidden');
// token.setAttribute('visibility', 'visible');
}

function handle_position_clicked(event)
{
 run_qh_notify("position-clicked", event.currentTarget.id);
}

function handle_token_clicked(event)
{
 run_qh_notify("token-clicked", event.currentTarget.id);
}

function handle_move_indicator_clicked(event)
{

}

function handle_text_indicator_clicked(event)
{

}

function qh_event_data(event)
{
 return [event.currentTarget.id, event.x - window.pageXOffset, 
   event.y - window.pageYOffset, window.pageXOffset, window.pageYOffset];
}

function qh_event_parent_node_data(event)
{
 return [event.currentTarget.parentNode.id, event.x - window.pageXOffset, 
   event.y - window.pageYOffset, window.pageXOffset, window.pageYOffset];
}



function handle_position_context_menu(event)
{
 event.preventDefault();
 run_qh_notify("position-context-menu", qh_event_data(event));
}

function handle_token_context_menu(event)
{
 event.preventDefault();
 run_qh_notify("token-context-menu", qh_event_data(event));
}

function handle_move_indicator_context_menu(event)

}

function handle_text_indicator_context_menu(event)
{
 event.preventDefault();
 run_qh_notify("text-indicator-context-menu", qh_event_parent_node_data(event));
}

 north_sidebars = Array.from(svgDoc.getElementsByClassName("side-shelf-right-emph"));

 let _hide_by_classname = function(...args)
 {
  Array.from(args.map(cn => svgDoc.getElementsByClassName(cn)))
    .flatMap(c => Array.from(c)).forEach(el => _hide_svg_element(el));
 }

 _hide_by_classname('south-chess-icon_copied', 'north-chess-icon_copied'); 

 let for_pairs = function(arr, fn) 
 {
  arr.forEach((val, index) => { if(index % 2) { fn(arr[index - 1], val); }}); 
 }

 let add_listeners = function(el, ...args) 
 {
  for_pairs(args, (a, b) => { el.addEventListener(a, b, false); });  
 }  

// let larr = svgDoc.getElementsByClassName('light-square');
// let darr = svgDoc.getElementsByClassName('dark-square');

// let hearr = svgDoc.getElementsByClassName('hidden-edge-polygon');

 let _add_listeners = function(...args)
 {
  Array.from(args.map(cn => svgDoc.getElementsByClassName(cn)))
   .flatMap(c => Array.from(c)) 
   .forEach(el => add_listeners(el, 'click', handle_position_clicked,
   'contextmenu', handle_position_context_menu));
 }

// Array.from(mis).forEach( el => _hide_svg_element(el) );

},false);
